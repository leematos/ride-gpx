[package]
name = "gpx-rider"
version = "0.1.0"
description = "GPX Rider desktop app for macOS"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gpx_rider_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-blec = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "gpx-rider"
path = "src/main.rs"
